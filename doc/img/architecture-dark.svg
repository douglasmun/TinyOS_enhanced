<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="TinyOS Enhanced architecture. Ring-3 user processes -- including the default login shell -- reach the kernel only through the int 0x80 privilege boundary, where copy_user validates every buffer and ECDSA P-256 verification gates every ELF load fail-closed; unsigned binaries are rejected there. Below it the ring-0 kernel provides process scheduling and supervised kernel daemons, PAE memory protection, a VFS over FAT32 and RAMFS (both read/write), and a TCP/IP stack whose receive path parses in task context behind a default-deny firewall and IDS, all driving i386 hardware.">
  <title>TinyOS Enhanced — architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e5534b"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4c8eda"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#0d1117"/>
  <text x="24" y="30" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf3">TinyOS Enhanced — architecture</text>
  <text x="24" y="50" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">32-bit i386 · Multiboot2 · 92 kernel modules · preemptive, single core</text>
  <rect x="24" y="68" width="952" height="104" rx="8" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="38" y="88" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#4c8eda">RING 3 · USER MODE</text>
  <text x="190" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#8b949e">linked at 0x08000000 · private PAE address space per process</text>
  <rect x="38" y="98" width="200" height="60" rx="6" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <text x="138" y="118" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#3fb950">shell.elf</text>
  <text x="138" y="133" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="700" fill="#3fb950">DEFAULT LOGIN SHELL</text>
  <text x="138" y="148" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">~35 builtins · signed</text>
  <rect x="250" y="98" width="200" height="60" rx="6" fill="none" stroke="#4c8eda" stroke-width="1.5"/>
  <text x="350" y="118" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#4c8eda">hello.elf / spawner.elf</text>
  <text x="350" y="133" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#8b949e">signed</text>
  <text x="350" y="148" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">SYS_SPAWN + argv</text>
  <rect x="462" y="98" width="200" height="60" rx="6" fill="none" stroke="#4c8eda" stroke-width="1.5"/>
  <text x="562" y="118" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#4c8eda">netprobe / msealprobe</text>
  <text x="562" y="133" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#8b949e">harness drivers</text>
  <text x="562" y="148" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">signed</text>
  <rect x="674" y="98" width="200" height="60" rx="6" fill="none" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="774" y="118" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8b949e">tiny libc</text>
  <text x="774" y="133" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" fill="#8b949e">userspace/libc.c</text>
  <text x="774" y="148" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">crt0 · printf · malloc</text>
  <rect x="886" y="98" width="90" height="60" rx="6" fill="none" stroke="#e5534b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="931" y="121" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#e5534b">unsigned</text>
  <text x="931" y="136" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#e5534b">rejected</text>
  <rect x="24" y="186" width="952" height="74" rx="8" fill="#161b22" stroke="#bb8009" stroke-width="1.6"/>
  <text x="38" y="206" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#bb8009">PRIVILEGE BOUNDARY</text>
  <text x="196" y="206" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#8b949e">the only way in — int 0x80 · 42 syscalls (SYS_EXIT 0 … SYS_ENV 41)</text>
  <text x="38" y="227" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#e6edf3">copy_user — every buffer bounds-checked and fault-safe</text>
  <text x="38" y="245" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#3fb950">ECDSA P-256 verify — fail-closed, ENFORCE by default</text>
  <text x="560" y="227" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#e6edf3">per-syscall gating: ungated · ownership · euid</text>
  <text x="560" y="245" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#8b949e">dispatcher counts rejections, never prints them</text>
  <line x1="500" y1="172" x2="500" y2="184" stroke="#4c8eda" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="500" y1="262" x2="500" y2="274" stroke="#4c8eda" stroke-width="1.5" marker-end="url(#ab)"/>
  <rect x="24" y="276" width="952" height="300" rx="8" fill="none" stroke="#30363d" stroke-width="1"/>
  <text x="38" y="296" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#3fb950">RING 0 · KERNEL</text>
  <text x="160" y="296" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#8b949e">no libc — freestanding C + NASM</text>
  <rect x="38" y="308" width="224" height="96" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="50" y="327" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e6edf3">Process &amp; scheduling</text>
  <text x="50" y="344" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">round-robin, preemptive (PIT)</text>
  <text x="50" y="357" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">kernel threads + ring-3 tasks</text>
  <text x="50" y="370" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">wait queues · blocking waitpid</text>
  <text x="50" y="383" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">pid + generation tuples</text>
  <text x="50" y="396" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">per-uid task cap + root reserve</text>
  <rect x="274" y="308" width="224" height="96" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="286" y="327" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e6edf3">Memory</text>
  <text x="286" y="344" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">PAE paging · NX / W^X</text>
  <text x="286" y="357" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">PMM · double-free detection</text>
  <text x="286" y="370" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">ASLR · guard pages (kernel+user)</text>
  <text x="286" y="383" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">per-process PDPT (COW tables)</text>
  <text x="286" y="396" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">ELF image frames tracked on exit</text>
  <rect x="510" y="308" width="224" height="96" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="522" y="327" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e6edf3">Storage — VFS</text>
  <text x="522" y="344" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">permission checks in the primitive</text>
  <text x="522" y="357" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">C:  FAT32   (read / write)</text>
  <text x="522" y="370" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">D:  RAMFS   (read / write)</text>
  <text x="522" y="383" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">unlink refuses a busy node</text>
  <text x="522" y="396" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">drivers stay stdio-agnostic</text>
  <rect x="746" y="308" width="230" height="96" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="758" y="327" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e6edf3">Security &amp; crypto</text>
  <text x="758" y="344" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">AES · SHA-2 · HMAC · PBKDF2</text>
  <text x="758" y="357" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">ECDSA · ECDHE · HKDF</text>
  <text x="758" y="370" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">EDR daemon (supervised)</text>
  <text x="758" y="383" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">tamper-evident audit log</text>
  <text x="758" y="396" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">credential store</text>
  <rect x="38" y="416" width="460" height="84" rx="6" fill="#161b22" stroke="#4c8eda" stroke-width="1.4"/>
  <text x="50" y="435" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#4c8eda">Network — RX parses in TASK context</text>
  <text x="50" y="452" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">ISR copies frame → rx_softirq_ring → knetd drains (IF=1, CPL 0)</text>
  <text x="50" y="465" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">firewall: default DENY ALL · IDS signature match → block</text>
  <text x="50" y="478" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">TCP · IP · ICMP · ARP · DHCP · DNS</text>
  <text x="50" y="491" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">counters, not kprintf: no per-packet print on the RX path</text>
  <rect x="510" y="416" width="466" height="84" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.4"/>
  <text x="522" y="435" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#3fb950">Kernel daemons — supervised</text>
  <text x="522" y="452" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">knetd     RX bottom half     (restart-limited, give-up)</text>
  <text x="522" y="465" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">ktimerd   timer bottom half</text>
  <text x="522" y="478" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">supervisor  CAP_UNKILLABLE · validates pid+generation</text>
  <text x="522" y="491" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">edr_daemon  behavioural scan · enqueued at boot</text>
  <rect x="38" y="512" width="938" height="50" rx="6" fill="none" stroke="#30363d" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="50" y="532" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e6edf3">Kernel shell (fallback) · stream layer</text>
  <text x="50" y="550" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">reached with `kshell` · ~70 builtins · machine-state + networking tools stay here (pae, mem, wxaudit, auditlog) — together an ASLR defeat, so euid-0 gated</text>
  <line x1="500" y1="578" x2="500" y2="590" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="24" y="592" width="952" height="84" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="38" y="612" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#8b949e">HARDWARE · i386</text>
  <text x="38" y="637" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#e6edf3">PIC · PIT · IDT</text>
  <text x="38" y="654" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">interrupts + timer</text>
  <text x="232" y="637" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#e6edf3">IDE disk</text>
  <text x="232" y="654" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">block I/O → FAT32</text>
  <text x="426" y="637" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#e6edf3">Intel e1000 NIC</text>
  <text x="426" y="654" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">DMA ring + IRQ 11, guard-paged</text>
  <text x="700" y="637" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#e6edf3">VBE framebuffer</text>
  <text x="700" y="654" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">fbcon · RDRAND / RDSEED</text>
</svg>
