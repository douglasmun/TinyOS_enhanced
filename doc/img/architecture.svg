<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="TinyOS Enhanced architecture. Ring-3 user processes reach the kernel only through the int 0x80 privilege boundary, where copy_user validates every buffer and ECDSA P-256 verification gates every ELF load fail-closed; unsigned binaries are rejected at that boundary. Below it the ring-0 kernel provides process scheduling, PAE memory protection, a VFS over FAT32 and RAMFS, and a TCP/IP stack, all driving i386 hardware.">
  <title>TinyOS Enhanced — architecture</title>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#bb8009"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e5534b"/>
    </marker>
  </defs>

  <text x="24" y="30" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#7d8590">TinyOS Enhanced — architecture</text>
  <text x="24" y="50" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">32-bit i386 · Multiboot2 · 81 kernel modules · preemptive, single core</text>

  <!-- ================= RING 3 ================= -->
  <rect x="24" y="68" width="952" height="92" rx="8" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="38" y="88" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#4c8eda">RING 3 · USER MODE</text>
  <text x="172" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#8b949e">linked at 0x08000000 · private PAE address space per process</text>

  <rect x="38" y="98" width="166" height="48" rx="6" fill="none" stroke="#4c8eda" stroke-width="1.5"/>
  <text x="121" y="117" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#4c8eda">hello.elf</text>
  <text x="121" y="133" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">signed</text>

  <rect x="216" y="98" width="166" height="48" rx="6" fill="none" stroke="#4c8eda" stroke-width="1.5"/>
  <text x="299" y="117" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#4c8eda">spawner.elf</text>
  <text x="299" y="133" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">SYS_SPAWN + argv</text>

  <rect x="394" y="98" width="166" height="48" rx="6" fill="none" stroke="#4c8eda" stroke-width="1.5"/>
  <text x="477" y="117" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#4c8eda">sleeper.elf</text>
  <text x="477" y="133" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">blocks on SYS_SLEEP</text>

  <rect x="572" y="98" width="166" height="48" rx="6" fill="none" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="655" y="117" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8b949e">tiny libc</text>
  <text x="655" y="133" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">crt0 · printf · malloc</text>

  <rect x="784" y="98" width="178" height="48" rx="6" fill="none" stroke="#e5534b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="873" y="117" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#e5534b">unsigned binary</text>
  <text x="873" y="133" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">tampered / no trailer</text>

  <!-- arrows into the gate -->
  <line x1="121" y1="146" x2="121" y2="190" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="128" y="171" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">syscall</text>
  <line x1="299" y1="146" x2="299" y2="190" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="477" y1="146" x2="477" y2="190" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="873" y1="146" x2="873" y2="190" stroke="#e5534b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ad)"/>
  <text x="881" y="171" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#e5534b">rejected</text>

  <!-- ============ PRIVILEGE BOUNDARY ============ -->
  <rect x="24" y="192" width="952" height="74" rx="8" fill="none" stroke="#bb8009" stroke-width="2"/>
  <text x="38" y="212" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#bb8009">PRIVILEGE BOUNDARY</text>
  <text x="188" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#8b949e">the only way into the kernel</text>

  <rect x="38" y="222" width="222" height="30" rx="5" fill="none" stroke="#bb8009" stroke-width="1.3"/>
  <text x="149" y="242" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#bb8009">int 0x80 · 20 syscalls</text>

  <rect x="272" y="222" width="248" height="30" rx="5" fill="none" stroke="#bb8009" stroke-width="1.3"/>
  <text x="396" y="242" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#bb8009">copy_user · bounds + fault safe</text>

  <rect x="532" y="222" width="430" height="30" rx="5" fill="none" stroke="#bb8009" stroke-width="1.3"/>
  <text x="747" y="242" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#bb8009">ECDSA P-256 verify — fail-closed, ENFORCE by default</text>

  <!-- gate -> kernel -->
  <line x1="149" y1="266" x2="149" y2="306" stroke="#bb8009" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="157" y="290" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">dispatch</text>
  <line x1="747" y1="266" x2="747" y2="306" stroke="#bb8009" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="755" y="290" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">load only if PASS</text>

  <!-- ================= RING 0 ================= -->
  <rect x="24" y="308" width="952" height="228" rx="8" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="38" y="328" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#347d39">RING 0 · KERNEL</text>
  <text x="152" y="328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#8b949e">no libc — freestanding C + NASM</text>

  <rect x="38" y="338" width="222" height="104" rx="6" fill="none" stroke="#347d39" stroke-width="1.5"/>
  <text x="149" y="357" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#347d39">Process &amp; scheduling</text>
  <text x="50" y="377" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">round-robin, preemptive (PIT)</text>
  <text x="50" y="393" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">kernel threads + ring-3 tasks</text>
  <text x="50" y="409" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">wait queues · blocking waitpid</text>
  <text x="50" y="425" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">pid + generation tuples</text>

  <rect x="272" y="338" width="222" height="104" rx="6" fill="none" stroke="#347d39" stroke-width="1.5"/>
  <text x="383" y="357" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#347d39">Memory</text>
  <text x="284" y="377" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">PAE paging · NX / W^X</text>
  <text x="284" y="393" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">PMM · double-free detection</text>
  <text x="284" y="409" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">ASLR · stack guard pages</text>
  <text x="284" y="425" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">per-process PDPT (COW tables)</text>

  <rect x="506" y="338" width="222" height="104" rx="6" fill="none" stroke="#347d39" stroke-width="1.5"/>
  <text x="617" y="357" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#347d39">Storage — VFS</text>
  <text x="518" y="377" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">permission checks in VFS layer</text>
  <text x="518" y="393" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">C:  FAT32  (read)</text>
  <text x="518" y="409" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">D:  RAMFS  (read/write)</text>
  <text x="518" y="425" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">drivers stay stdio-agnostic</text>

  <rect x="740" y="338" width="222" height="104" rx="6" fill="none" stroke="#347d39" stroke-width="1.5"/>
  <text x="851" y="357" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#347d39">Network</text>
  <text x="752" y="377" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">TCP · IP · ICMP · ARP</text>
  <text x="752" y="393" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">DHCP · DNS</text>
  <text x="752" y="409" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">firewall + IDS (compile-time)</text>
  <text x="752" y="425" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">anti-spoofing checks</text>

  <rect x="38" y="456" width="556" height="62" rx="6" fill="none" stroke="#8b949e" stroke-width="1.2"/>
  <text x="316" y="476" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#7d8590">Shell (kernel task) · stream layer</text>
  <text x="316" y="494" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">jobs &amp; background exec · redirection &gt; &lt; · pipelines cmd | cmd</text>
  <text x="316" y="509" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">stages run sequentially · 4 KB pipe buffer</text>

  <!-- Sits between the two hardware drops (x=617, x=851), so the dashed
       VFS/NIC lines pass either side of it rather than through its text. -->
  <rect x="640" y="456" width="188" height="62" rx="6" fill="none" stroke="#8b949e" stroke-width="1.2"/>
  <text x="734" y="476" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#7d8590">Security &amp; crypto</text>
  <text x="734" y="493" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">AES · SHA-2 · HMAC · PBKDF2</text>
  <text x="734" y="507" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">ECDSA · ECDHE · HKDF · EDR</text>

  <rect x="864" y="456" width="98" height="62" rx="6" fill="none" stroke="#8b949e" stroke-width="1.2"/>
  <text x="913" y="476" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#7d8590">Audit</text>
  <text x="913" y="493" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">tamper-evident</text>
  <text x="913" y="507" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">credential store</text>

  <!-- kernel -> hardware -->
  <line x1="383" y1="518" x2="383" y2="562" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- VFS and NIC reach hardware directly, dropping through the gap to the
       right of the security panel so neither line crosses its text. -->
  <line x1="617" y1="442" x2="617" y2="562" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="625" y="548" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">block I/O</text>

  <line x1="851" y1="442" x2="851" y2="562" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="859" y="548" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8b949e">DMA + IRQ</text>

  <!-- ================= HARDWARE ================= -->
  <rect x="24" y="564" width="952" height="60" rx="8" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="38" y="584" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#7d8590">HARDWARE · i386</text>

  <rect x="178" y="576" width="146" height="34" rx="5" fill="none" stroke="#8b949e" stroke-width="1.1"/>
  <text x="251" y="597" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#8b949e">PIC · PIT · IDT</text>

  <rect x="336" y="576" width="146" height="34" rx="5" fill="none" stroke="#8b949e" stroke-width="1.1"/>
  <text x="409" y="597" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#8b949e">IDE disk</text>

  <rect x="494" y="576" width="146" height="34" rx="5" fill="none" stroke="#8b949e" stroke-width="1.1"/>
  <text x="567" y="597" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#8b949e">Intel e1000 NIC</text>

  <rect x="652" y="576" width="146" height="34" rx="5" fill="none" stroke="#8b949e" stroke-width="1.1"/>
  <text x="725" y="597" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#8b949e">VBE framebuffer</text>

  <rect x="810" y="576" width="152" height="34" rx="5" fill="none" stroke="#8b949e" stroke-width="1.1"/>
  <text x="886" y="597" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#8b949e">RDRAND / RDSEED</text>
</svg>
